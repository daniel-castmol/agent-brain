[project]
name = "brain"
version = "0.1.0"
description = "Local markdown-based memory layer for AI agents, exposed via MCP."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daniel Castillo" }]
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1.0",
    "fastembed>=0.4.0",
    "mcp>=1.2.0",
    "python-frontmatter>=1.1.0",
    "watchdog>=4.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
brain = "brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that load real ML models (slow, requires download)",
]
